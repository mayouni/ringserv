<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RingServ · panel</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1c2430; --dim: #6b7684;
    --line: #e3e7ec; --ok: #22a06b; --off: #b9c0c9; --accent: #2e5ea8;
    --danger: #b4423a; --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 14px;
    padding: 18px 28px 14px; border-bottom: 1px solid var(--line);
    background: var(--card);
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  header .meta { color: var(--dim); font-size: 13px; }
  header .grow { flex: 1; }
  main { max-width: 880px; margin: 26px auto; padding: 0 20px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    margin-bottom: 16px; overflow: hidden;
  }
  /* WRAPS rather than overflowing. A row that runs off the side of a
     narrow window puts the app's NAME out of reach -- the one thing the
     row exists to tell you -- and gives the page a horizontal scrollbar
     nobody wants. Measured at 632px, where the name read as "ir". */
  .row {
    display: flex; align-items: center; gap: 12px; padding: 14px 18px;
    flex-wrap: wrap;
  }
  .row .name { flex: 0 0 auto; }
  .row .info { flex: 1 1 auto; min-width: 0; }
  /* Below this, the buttons take a line of their own rather than
     squeezing the identity off the row. */
  @media (max-width: 720px) {
    .row .grow { display: none; }
    .row .open, .row button { flex: 1 1 auto; }
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--off); flex: none; }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 4px rgba(34,160,107,.14); }
  .name { font-weight: 650; font-size: 16px; }
  .tag {
    font: 11px/1 var(--mono); color: var(--dim); border: 1px solid var(--line);
    border-radius: 20px; padding: 3px 9px;
  }
  .info { color: var(--dim); font-size: 13px; }
  .grow { flex: 1; }
  button {
    font: 600 13px system-ui, sans-serif; padding: 7px 14px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.08); color: #fff; }
  button.danger:hover { border-color: var(--danger); color: var(--danger); }
  button:disabled { opacity: .45; cursor: default; pointer-events: none; }
  a.open { font-size: 13px; color: var(--accent); text-decoration: none; }
  a.open:hover { text-decoration: underline; }
  .drawer { border-top: 1px solid var(--line); background: #fbfcfd; padding: 12px 18px; display: none; }
  .drawer.show { display: block; }
  .drawer h3 { margin: 4px 0 8px; font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .6px; }
  pre.log {
    font: 12px/1.5 var(--mono); background: #10151c; color: #cdd6e0;
    border-radius: 8px; padding: 12px 14px; max-height: 220px; overflow: auto;
    white-space: pre-wrap; word-break: break-word; margin: 0 0 6px;
  }
  .callbox { display: flex; gap: 8px; margin-top: 10px; }
  .callbox input {
    font: 13px var(--mono); padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 7px; background: var(--card); color: var(--ink);
  }
  .callbox .act { width: 130px; }
  .callbox .pay { flex: 1; }
  pre.answer {
    font: 12.5px/1.5 var(--mono); background: #eef3ee; color: #1c4429;
    border: 1px solid #d6e5d6; border-radius: 7px; padding: 8px 12px;
    margin: 8px 0 2px; white-space: pre-wrap; word-break: break-word;
  }
  pre.answer.err { background: #f7efee; color: #6d2822; border-color: #e8d5d2; }
  .empty { color: var(--dim); text-align: center; padding: 40px 0; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px; font-size: 13px;
    color: var(--dim); border: 1px solid var(--line); border-radius: 20px;
    padding: 5px 12px; background: var(--card);
  }
  /* the inline confirm — a question where the button was, never a popup */
  .ask {
    display: inline-flex; align-items: center; gap: 8px; font-size: 13px;
    color: var(--ink); background: #fdf6ec; border: 1px solid #ecdcc2;
    border-radius: 8px; padding: 5px 6px 5px 12px; animation: askin .15s ease-out;
  }
  @keyframes askin { from { opacity: 0; transform: translateY(-3px); } }
  .ask button { padding: 5px 11px; font-size: 12.5px; }
  .ask .b-yes { background: var(--danger); border-color: var(--danger); color: #fff; }
  .ask .b-yes:hover { filter: brightness(1.08); color: #fff; }
  footer { text-align: center; color: var(--dim); font-size: 12px; padding: 18px 0 30px; }
  .b-reload { border-color: var(--line); }
  .b-reload:hover { border-color: var(--accent); color: var(--accent); }
  .note { font-size: 12.5px; padding: 6px 2px 0; line-height: 1.45; }
  .note[data-kind="ok"]   { color: var(--ok, #2f7d4f); }
  .note[data-kind="warn"] { color: var(--warn, #b4762a); }
  .note[data-kind="bad"]  { color: crimson; font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>RingServ <span style="color:var(--dim);font-weight:400">· panel</span></h1>
  <span class="meta" id="meta">…</span>
  <span class="grow"></span>
  <span class="chip" id="chip"><span class="dot" id="chipdot"></span><span id="chiptext">…</span></span>
  <span id="srvarea">
    <button class="primary" id="srvbtn" onclick="toggleServer()" disabled>…</button>
  </span>
</header>
<main id="apps"><div class="empty">connecting…</div></main>
<footer>loopback only · the panel starts, stops and watches — it never guesses</footer>
<script>
"use strict";
const open = new Set();          // drawers the operator opened, by app name
let dead = false;

function fmtUp(s) {
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m " + (s % 60) + "s";
  return Math.floor(s / 3600) + "h " + Math.floor((s % 3600) / 60) + "m";
}

async function refresh() {
  if (dead) return;
  let st;
  try { st = await (await fetch("/panel/state")).json(); }
  catch { document.getElementById("meta").textContent = "panel unreachable"; return; }
  document.getElementById("meta").textContent =
    "v" + st.version + " · up " + fmtUp(st.uptime) + " · " + st.apps.length + " app" +
    (st.apps.length === 1 ? "" : "s");
  paintServer(st.running, st.apps.length);
  const main = document.getElementById("apps");
  for (const a of st.apps) {
    let card = document.getElementById("app-" + a.name);
    if (!card) { card = buildCard(a); main.appendChild(card); }
    if (main.querySelector(".empty")) main.querySelector(".empty").remove();
    card.querySelector(".dot").className = "dot" + (a.status === "running" ? " on" : "");
    card.querySelector(".info").textContent =
      (a.port ? "port " + a.port : "port unknown") +
      (a.status === "running" ? " · pid " + a.pid + " · up " + fmtUp(a.uptime) : " · stopped");
    card.querySelector(".b-start").disabled = a.status === "running";
    card.querySelector(".b-stop").disabled = a.status !== "running";
    const link = card.querySelector("a.open");
    if (a.port && a.status === "running") {
      link.style.display = ""; link.href = "http://127.0.0.1:" + a.port + "/";
    } else link.style.display = "none";
    if (open.has(a.name)) pollLogs(a.name);
  }
}

function buildCard(a) {
  const el = document.createElement("div");
  el.className = "card"; el.id = "app-" + a.name;
  el.innerHTML =
    '<div class="row">' +
      '<span class="dot"></span>' +
      '<span class="name"></span>' +
      '<span class="tag"></span>' +
      '<span class="info"></span>' +
      '<span class="grow"></span>' +
      '<a class="open" target="_blank" rel="noopener">open ↗</a>' +
      '<button class="b-logs">Details</button>' +
      '<button class="b-start primary">Start</button>' +
      '<button class="b-reload" title="re-read the code without stopping the server">Reload</button>' +
      '<button class="b-stop">Stop</button>' +
    '</div>' +
    '<div class="drawer">' +
      '<h3>log tail</h3><pre class="log">—</pre>' +
      '<h3>call it</h3>' +
      '<div class="callbox">' +
        '<input class="act" placeholder="action">' +
        '<input class="pay" placeholder=\'payload, e.g. {"a": 19, "b": 23}\'>' +
        '<button class="b-call primary">Call</button>' +
      '</div>' +
      '<pre class="answer" style="display:none"></pre>' +
    '</div>';
  el.querySelector(".name").textContent = a.name;
  el.querySelector(".tag").textContent = a.mode === "serve" ? "gesture" : "app";
  el.querySelector(".b-start").onclick = () => act("start", a.name);
  el.querySelector(".b-stop").onclick = () => act("stop", a.name);
  el.querySelector(".b-reload").onclick = () => reload(a.name, el);
  el.querySelector(".b-logs").onclick = () => {
    const d = el.querySelector(".drawer");
    d.classList.toggle("show");
    if (d.classList.contains("show")) { open.add(a.name); pollLogs(a.name); }
    else open.delete(a.name);
  };
  el.querySelector(".b-call").onclick = () => call(a.name, el);
  return el;
}

async function act(verb, name) {
  await fetch("/panel/" + verb, { method: "POST", body: JSON.stringify({ name }) });
  setTimeout(refresh, 250);
}

// Change a running app's code without stopping it.
//
// THE ANSWER IS SHOWN, never assumed. A reload has three outcomes and only
// one of them is fine: every worker took the new code, NO worker took it
// (nothing changed -- safe), or SOME took it (the server is answering with
// two versions -- an emergency). A button that flashed the same green for
// all three would be worse than no button.
async function reload(name, card) {
  const btn = card.querySelector(".b-reload");
  const was = btn.textContent;
  btn.disabled = true; btn.textContent = "reloading...";
  let note = "", cls = "ok";
  try {
    const r = await fetch("/panel/reload", { method: "POST", body: JSON.stringify({ name }) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 200) {
      note = "reloaded - all " + (j.data ? j.data.workers : "?") + " workers took the new code";
    } else if (r.status === 422) {
      cls = "warn";
      note = "refused - the code would not run, so nothing changed. The server is untouched.";
    } else {
      cls = "bad";
      note = (j.message || j.error || "reload failed");
    }
  } catch (e) { cls = "bad"; note = "could not reach the app"; }
  btn.disabled = false; btn.textContent = was;
  say(card, note, cls);
  setTimeout(refresh, 250);
}

// One inline line under the row -- the panel's own convention: never a
// browser alert, never a toast that vanishes before it is read.
function say(card, text, cls) {
  let n = card.querySelector(".note");
  if (!n) {
    n = document.createElement("div");
    n.className = "note";
    card.appendChild(n);
  }
  n.textContent = text;
  n.dataset.kind = cls;
}

async function pollLogs(name) {
  const card = document.getElementById("app-" + name);
  if (!card) return;
  try {
    const text = await (await fetch("/panel/logs?app=" + encodeURIComponent(name))).text();
    const log = card.querySelector("pre.log");
    if (log.textContent !== text) { log.textContent = text || "—"; log.scrollTop = log.scrollHeight; }
  } catch {}
}

async function call(name, card) {
  const action = card.querySelector(".act").value.trim();
  let payload = card.querySelector(".pay").value.trim() || "{}";
  const out = card.querySelector("pre.answer");
  out.style.display = "";
  let pj;
  try { pj = JSON.parse(payload); }
  catch { out.className = "answer err"; out.textContent = "payload is not JSON: " + payload; return; }
  try {
    const r = await fetch("/panel/call", {
      method: "POST",
      body: JSON.stringify({ name, request: { service: name, action, payload: pj } }),
    });
    const text = await r.text();
    let pretty = text;
    try { pretty = JSON.stringify(JSON.parse(text), null, 1); } catch {}
    out.className = "answer" + (r.ok ? "" : " err");
    out.textContent = pretty;
  } catch (e) { out.className = "answer err"; out.textContent = "" + e; }
}

// The server toggle: stop halts every app but the panel STAYS — a stop
// button that kills the only thing able to start again is a trap.
let serverRunning = false;
let asking = false;
async function toggleServer() {
  if (!serverRunning) {
    document.getElementById("srvbtn").disabled = true;
    await fetch("/panel/server/start", { method: "POST" });
    setTimeout(refresh, 300);
    return;
  }
  // Stopping asks first — but INLINE, where the button was. A native
  // confirm() freezes the whole page and reads like an error; this is a
  // question, so it should look like one and stay out of the way.
  askInline();
}
function askInline() {
  asking = true;
  const area = document.getElementById("srvarea");
  area.innerHTML =
    '<span class="ask">Stop all running apps? The panel stays up.' +
      '<button class="b-yes">Stop them</button>' +
      '<button class="b-no">Keep running</button>' +
    '</span>';
  area.querySelector(".b-yes").onclick = async () => {
    asking = false;
    restoreButton();
    document.getElementById("srvbtn").disabled = true;
    await fetch("/panel/server/stop", { method: "POST" });
    setTimeout(refresh, 300);
  };
  area.querySelector(".b-no").onclick = () => { asking = false; restoreButton(); refresh(); };
  // An unanswered question should not squat in the header forever.
  setTimeout(() => { if (asking) { asking = false; restoreButton(); refresh(); } }, 8000);
}
function restoreButton() {
  document.getElementById("srvarea").innerHTML =
    '<button class="primary" id="srvbtn" onclick="toggleServer()" disabled>…</button>';
}
function paintServer(running, total) {
  serverRunning = running > 0;
  if (asking) return;          // never repaint over an open question
  const btn = document.getElementById("srvbtn");
  if (!btn) return;
  btn.textContent = serverRunning ? "Stop server" : "Start server";
  btn.className = serverRunning ? "danger" : "primary";
  btn.disabled = false;
  document.getElementById("chipdot").className = "dot" + (serverRunning ? " on" : "");
  document.getElementById("chiptext").textContent = serverRunning
    ? "serving · " + running + "/" + total + " apps"
    : "stopped";
}

refresh();
setInterval(refresh, 1500);
</script>
</body>
</html>
