<!-- The page calls its own services. Nothing here knows a URL scheme:
     it posts a {service, action, payload} envelope, which is the only
     shape RingServ speaks. -->
<meta charset="utf-8">
<title>Fieldnotes</title>
<h1>Fieldnotes</h1>
<form id="f">
  <input name="title" placeholder="title" required>
  <input name="place" placeholder="place">
  <input name="weight" type="number" value="10">
  <button>add</button>
</form>
<ul id="list"></ul>
<script>
const call = (service, action, payload) =>
  fetch("/api/v1", { method: "POST",
    body: JSON.stringify({ service, action, payload }) }).then(r => r.json());

async function refresh() {
  const r = await call("notes", "list", { limit: 50 });
  document.getElementById("list").innerHTML =
    r.data.rows.map(n => `<li>${n.title} — ${n.place || "?"} (${n.weight})</li>`).join("");
}

document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target));
  d.weight = Number(d.weight);
  const r = await call("notes", "create", d);
  if (r.code !== 0) return alert(r.message);   // the contract's words
  e.target.reset();
  refresh();
};
refresh();
</script>
