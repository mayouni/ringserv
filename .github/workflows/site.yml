# The site, published.
#
# site/ is a single self-contained page — no generator, no build step, no
# node_modules. That is deliberate: a project whose whole claim is "one
# binary, nothing to install" should not need a toolchain to publish a
# page about it. Locally it is served by the thing it documents:
#
#     ringserv run site/serve.ring
#
# Pages must be enabled once, by hand, in Settings -> Pages -> Source:
# "GitHub Actions". Until then this workflow will fail on deploy, and
# that failure is the instruction.

name: site

# MANUAL ON PURPOSE. Publishing the site is a decision, not a consequence
# of editing a file — and it cannot succeed until Pages is turned on by
# hand anyway (Settings → Pages → Source: "GitHub Actions"). Running it on
# every push only painted a red X for a step nobody has asked for yet.
#
# To publish: enable Pages, then run this workflow from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one half-done.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # serve.ring is the LOCAL preview server, not part of the published
      # site. Copying rather than uploading site/ wholesale keeps that
      # distinction explicit instead of relying on a reader noticing.
      - name: Assemble
        run: |
          mkdir -p _site
          cp site/index.html site/style.css site/favicon.svg site/ringserv-logo.png _site/
          ls -la _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
